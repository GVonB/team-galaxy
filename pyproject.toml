[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team-galaxy"
version = "0.2.1"
description = "Galaxy Project extensions for the team multi-agent LLM framework."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Fabio Cumbo" }]
keywords = ["llm", "galaxy", "bioinformatics", "multi-agent", "team", "planemo", "bioblend"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "team-core>=0.15.6",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
bioblend = ["bioblend>=1.3"]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]
all = ["team-galaxy[bioblend]"]

[project.entry-points."team.persona_dirs"]
galaxy = "team_galaxy:personas_dir"

[project.entry-points."team.skills"]
bioblend       = "team_galaxy.skills.bioblend"
planemo        = "team_galaxy.skills.planemo"
toolshed       = "team_galaxy.skills.toolshed"
iuc_standards  = "team_galaxy.skills.iuc_standards_skill"
iwc_checklist  = "team_galaxy.skills.iwc_checklist_skill"
gtn_format     = "team_galaxy.skills.gtn_format_skill"
bioconda_guide = "team_galaxy.skills.bioconda_guide_skill"

[project.entry-points."team.commands"]
galaxy = "team_galaxy.commands:galaxy"

[project.urls]
Homepage = "https://github.com/cumbof/team-galaxy"
Issues = "https://github.com/cumbof/team-galaxy/issues"

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that require a live Galaxy server and planemo",
]

[tool.setuptools.packages.find]
include = ["team_galaxy*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
team_galaxy = ["skills/*.py", "skills/*.md", "personas/*.yaml", "examples/*.yaml"]
